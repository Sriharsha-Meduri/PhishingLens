<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PhishingLens - multi-modal AI phishing detection for email, SMS, and URLs. Real-time verdicts with explainable signals." />
    <title>PhishingLens - AI Phishing Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Sora', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              ink: '#070b16',
              panel: '#0d1424',
              panel2: '#111a2e',
              line: '#1e2b45',
              brand: { DEFAULT: '#38bdf8', deep: '#0ea5e9' },
              safe: '#10b981',
              warn: '#f59e0b',
              danger: '#f43f5e',
            },
            keyframes: {
              floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
              sweep: { '0%': { transform: 'translateY(-100%)' }, '100%': { transform: 'translateY(400%)' } },
              pulseRing: { '0%': { transform: 'scale(0.8)', opacity: '0.7' }, '100%': { transform: 'scale(2.2)', opacity: '0' } },
            },
            animation: {
              floaty: 'floaty 6s ease-in-out infinite',
              sweep: 'sweep 2.5s linear infinite',
              pulseRing: 'pulseRing 2s ease-out infinite',
            },
          },
        },
      };
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { background-color: #070b16; color: #e2e8f0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(56,189,248,0.3); }
      .grid-bg {
        background-image: linear-gradient(rgba(56,189,248,0.06) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(56,189,248,0.06) 1px, transparent 1px);
        background-size: 44px 44px;
      }
      .glass { background: rgba(13,20,36,0.7); backdrop-filter: blur(12px); }
      textarea, input { font-family: inherit; }
      /* Mobile refinements (max-width only; desktop untouched) */
      @media (max-width: 767px) {
        html, body { overflow-x: hidden; }
        .hero-h1 { font-size: 2.6rem !important; line-height: 1.05 !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

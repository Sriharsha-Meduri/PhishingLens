apiVersion: v1
kind: Secret
metadata:
  name: phishing-detection-secrets
  namespace: phishing-detection
type: Opaque
data:
  # Base64 encoded API keys (replace with actual values)
  OTX_API_KEY: ""  # echo -n "your-otx-key" | base64
  PHISHTANK_API_KEY: ""  # echo -n "your-phishtank-key" | base64
  MISP_API_KEY: ""  # echo -n "your-misp-key" | base64
  MISP_URL: ""  # echo -n "https://your-misp-instance" | base64
  
  # Database credentials (if using external DB)
  DB_HOST: ""  # echo -n "your-db-host" | base64
  DB_USER: ""  # echo -n "your-db-user" | base64
  DB_PASSWORD: ""  # echo -n "your-db-password" | base64
  
  # JWT secrets
  JWT_SECRET: ""  # echo -n "your-jwt-secret" | base64
  
  # Webhook URLs
  NOTIFICATION_WEBHOOK: ""  # echo -n "https://your-webhook-url" | base64

apiVersion: v1
kind: PersistentVolume
metadata:
  name: models-pv
  namespace: phishing-detection
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: models-storage
  hostPath:
    path: /data/phishing-detection/models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: phishing-detection
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: models-storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-pv
  namespace: phishing-detection
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: data-storage
  hostPath:
    path: /data/phishing-detection/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: phishing-detection
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: data-storage

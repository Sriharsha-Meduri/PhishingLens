apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: phishing-detection
  labels:
    app: gateway
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        component: api
    spec:
      containers:
      - name: gateway
        image: phishing-detection/gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: TEXT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: phishing-detection-config
              key: TEXT_SERVICE_URL
        - name: URL_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: phishing-detection-config
              key: URL_SERVICE_URL
        - name: IMAGE_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: phishing-detection-config
              key: IMAGE_SERVICE_URL
        - name: GRAPH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: phishing-detection-config
              key: GRAPH_SERVICE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: phishing-detection
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

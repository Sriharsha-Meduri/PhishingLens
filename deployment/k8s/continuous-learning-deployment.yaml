apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuous-learning
  namespace: phishing-detection
  labels:
    app: continuous-learning
    component: training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: continuous-learning
  template:
    metadata:
      labels:
        app: continuous-learning
        component: training
    spec:
      containers:
      - name: continuous-learning
        image: phishing-detection/continuous-learning:latest
        env:
        - name: OTX_API_KEY
          valueFrom:
            secretKeyRef:
              name: phishing-detection-secrets
              key: OTX_API_KEY
        - name: PHISHTANK_API_KEY
          valueFrom:
            secretKeyRef:
              name: phishing-detection-secrets
              key: PHISHTANK_API_KEY
        - name: MISP_API_KEY
          valueFrom:
            secretKeyRef:
              name: phishing-detection-secrets
              key: MISP_API_KEY
        - name: MISP_URL
          valueFrom:
            secretKeyRef:
              name: phishing-detection-secrets
              key: MISP_URL
        - name: NOTIFICATION_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: phishing-detection-secrets
              key: NOTIFICATION_WEBHOOK
        volumeMounts:
        - name: models-volume
          mountPath: /models
        - name: data-volume
          mountPath: /data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import requests; requests.get('http://localhost:8000/health', timeout=5)"
          initialDelaySeconds: 120
          periodSeconds: 60
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: continuous-learning-service
  namespace: phishing-detection
  labels:
    app: continuous-learning
spec:
  selector:
    app: continuous-learning
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

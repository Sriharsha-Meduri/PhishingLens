global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'text'
    static_configs:
      - targets: ['text:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'url'
    static_configs:
      - targets: ['url:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'image'
    static_configs:
      - targets: ['image:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'graph'
    static_configs:
      - targets: ['graph:8004']
    metrics_path: '/metrics'
    scrape_interval: 10s

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: phishing-detection-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: phishing-detection
          __path__: /var/log/*.log
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            message: message
      
      - timestamp:
          source: timestamp
          format: RFC3339
      
      - labels:
          level:
          service:
      
      - output:
          source: message

  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container_name
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream
      - source_labels: ['__meta_docker_container_label_logging']
        target_label: logging
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: time
            level: level
            message: msg
      
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      
      - labels:
          level:
          container_name:
      
      - output:
          source: message
